<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.4"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.3" stroke-dasharray="8 4"/>
  
  <!-- Brain/AI circuit pattern -->
  <g transform="translate(100,60)" filter="url(#glow)">
    <!-- Circuit brain -->
    <path d="M-30,30 Q0,-10 30,30" fill="none" stroke="#6c5ce7" stroke-width="2.5"/>
    <path d="M-25,40 Q0,5 25,40" fill="none" stroke="#00cec9" stroke-width="2.5"/>
    <circle cx="0" cy="20" r="5" fill="url(#g1)" opacity="0.8"/>
    <!-- Data nodes -->
    <circle cx="-25" cy="30" r="4" fill="#6c5ce7"/>
    <circle cx="25" cy="30" r="4" fill="#6c5ce7"/>
    <circle cx="-20" cy="40" r="3" fill="#00cec9"/>
    <circle cx="20" cy="40" r="3" fill="#00cec9"/>
  </g>
  
  <!-- Data bars -->
  <g transform="translate(100,120)" filter="url(#glow)">
    <rect x="-40" y="-15" width="12" height="30" rx="2" fill="#6c5ce7" opacity="0.6"/>
    <rect x="-22" y="-25" width="12" height="40" rx="2" fill="#7c6cf0" opacity="0.7"/>
    <rect x="-4" y="-35" width="12" height="50" rx="2" fill="#8b7cf5" opacity="0.8"/>
    <rect x="14" y="-20" width="12" height="35" rx="2" fill="#00cec9" opacity="0.6"/>
    <rect x="32" y="-10" width="12" height="25" rx="2" fill="#00cec9" opacity="0.5"/>
  </g>
  
  <!-- MGMT text -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="url(#g1)" opacity="0.25">MGMT</text>
  
  <!-- Bottom decorative line -->
  <line x1="40" y1="160" x2="160" y2="160" stroke="url(#g1)" stroke-width="1.5" opacity="0.3"/>
</svg>
