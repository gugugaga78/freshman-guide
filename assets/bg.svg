      <line x1="0" y1="80" x2="80" y2="80" stroke="rgba(108,92,231,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0a0a1a"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
